# Configuracion basica
spring.application.name=harmonyGymBack

# Database - Usa variables de entorno
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Puerto (Render lo asigna dinamicamente)
server.port=${PORT:8080}

# Errores detallados (desactivar en produccion)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Logging (menos detallado en produccion)
logging.level.com.example.harmonyGymBack=INFO
logging.level.org.springframework.web=INFO

# ==================== EMAIL CONFIGURATION ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Template Properties
app.email.from=
app.email.subject.credenciales=Tus credenciales de HarmonyGym
app.email.subject.bienvenida=Bienvenido a HarmonyGym

# ==================== PAYPAL CONFIGURATION ====================
paypal.client-id=
paypal.client-secret=
paypal.mode=
paypal.base-url=https://api-m.paypal.com
paypal.api-url=https://api-m.paypal.com
paypal.web-url=https://www.paypal.com
paypal.success-url=
paypal.cancel-url=

# ==================== JWT CONFIGURATION ====================
jwt.secret=
jwt.expiration=

# ==================== CORS CONFIGURATION ====================
cors.allowed-origins=
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ==================== FILE UPLOAD CONFIGURATION ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== SPRING DOCUMENTATION (Swagger) ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
